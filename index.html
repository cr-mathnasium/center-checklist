<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Center Cleaning Checklist</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="navbar">
        <button class="nav-btn active" onclick="switchTab('Current Week', this)">This Week</button>
        <button class="nav-btn" onclick="switchTab('Archive Log', this)">Archive</button>
        <button class="nav-btn" onclick="switchTab('Next Week', this)">Next Week</button>
        <button class="nav-btn" onclick="switchTab('Master Task List', this)">Default Week</button>
    </div>

    <div class="container">
        <div class="header-bar">
            <h2>Cleaning Checklist Dashboard</h2>
            <div class="header-right-controls">
                <button id="undo-btn" class="action-btn undo-btn" style="display: none;" onclick="undoLastAction()">↩ Undo (0)</button>
                <button id="toggle-edit-btn" class="action-btn edit-toggle-btn" onclick="toggleEditMode()">✏️ Edit Mode</button>
                <div class="reminder">REMINDER: Report Behavior issues to CD right away.</div>
            </div>
        </div>

        <!-- Archive Selector Bar -->
        <div id="archive-selector-container" class="days-selector-bar" style="display: none;">
            <strong>Select Archive Period:</strong>
            <select id="archive-week-select" onchange="changeArchiveWeek(this.value)">
                <option value="1">Week 1 (Last Week)</option>
                <option value="2">Week 2 (2 Weeks Ago)</option>
            </select>
        </div>

        <!-- Rotate & Reset Week Bar (Next Week Tab) -->
        <div id="rotate-week-container" class="rotate-week-bar" style="display: none;">
            <span>Next Week Controls:</span>
            <div style="display: flex; gap: 8px;">
                <button class="action-btn reset-btn" onclick="triggerNextWeekReset()">↺ Reset to Default Week</button>
                <button class="action-btn rotate-btn" onclick="triggerWeekRotation()">🔄 Promote Next Week to Current Week & Archive</button>
            </div>
        </div>

        <!-- Operating Days Selector (Default Week Tab) -->
        <div id="days-selector-container" class="days-selector-bar" style="display: none;">
            <strong>Default Operating Days:</strong>
            <div id="day-checkboxes"></div>
            <button class="action-btn" onclick="saveOperatingDays()">Save Operating Days</button>
        </div>

        <!-- Add Task Bar -->
        <div id="add-task-container" class="add-task-bar" style="display: none;">
            <input type="text" id="new-section" placeholder="Section (e.g. Kitchen)">
            <input type="text" id="new-desc" placeholder="Task Description">
            <select id="new-schedule">
                <option value="Sun">Sun</option>
                <option value="Mon">Mon</option>
                <option value="Tues">Tues</option>
                <option value="Wed">Wed</option>
                <option value="Thurs">Thurs</option>
                <option value="Fri">Fri</option>
                <option value="Sat">Sat</option>
            </select>
            <button class="action-btn green-btn" onclick="addNewTask()">+ Add Task</button>
        </div>

        <div id="checklist-content">Loading checklist matrix...</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
