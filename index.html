<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Center Cleaning Checklist</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="navbar">
        <button class="nav-btn active" onclick="switchTab('Current Week', this)">This Week</button>
        <button class="nav-btn" onclick="switchTab('Archive Log', this)">Last Week</button>
        <button class="nav-btn" onclick="switchTab('Next Week', this)">Next Week</button>
        <button class="nav-btn" onclick="switchTab('Master Task List', this)">Default Week</button>
    </div>

    <div class="container">
        <div class="header-bar">
            <h2>Cleaning Checklist Dashboard</h2>
            <div class="reminder">REMINDER: Report Behavior issues to CD right away. Especially if disruptive, distracting, or disrespectful.</div>
        </div>
        <div id="checklist-content">Loading tasks...</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
